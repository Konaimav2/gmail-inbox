<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mail Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --bg:#0b0e13; --bg2:#12161d; --bg3:#171c24; --line:#232935; --line2:#2e3545;
  --txt:#e7eaf0; --mut:#9aa4b2; --dim:#8893a3;
  --acc:#4f8cff; --acc2:#7ab8ff; --ok:#2fb96b; --warn:#e3b341; --err:#ef5350;
  --r:12px; --mono:ui-monospace,'Cascadia Code',Menlo,monospace;
  --t:160ms cubic-bezier(.2,.7,.3,1);
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);margin:0;font-size:14px;overflow-x:hidden}
.addrbar{position:relative}
header{background:rgba(11,14,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:0 18px;height:56px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2d63e0,#7a5cff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;box-shadow:0 4px 14px #2d63e033;flex:none}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 .dot{color:var(--acc)}
.brand .tag{font-size:11px;color:var(--dim);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:2px}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.hdr-actions a,.hdr-actions button{height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 13px;border-radius:9px;font-size:12.5px;cursor:pointer;text-decoration:none;border:1px solid var(--line2);background:var(--bg3);color:var(--txt);transition:border-color var(--t),background var(--t)}
.hdr-actions a:hover,.hdr-actions button:hover{border-color:var(--acc)}
.muted{color:var(--dim);font-size:12px}
.addrbar{background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.addr{font-size:17px;font-weight:700;letter-spacing:.3px;color:var(--acc2);font-family:var(--mono);word-break:break-all;cursor:pointer}
.addr:hover{text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--line2);color:var(--mut);font-size:11px;border-radius:999px;padding:3px 10px;font-weight:600}
.badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--dim)}
.badge.on{color:var(--ok);border-color:#1f5036}.badge.on::before{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.badge.err{color:var(--err);border-color:#55302f}.badge.err::before{background:var(--err)}
.badge.sync::before{background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
select,button.btn{background:var(--bg3);color:var(--txt);border:1px solid var(--line2);border-radius:9px;padding:0 12px;height:40px;font-size:13px;cursor:pointer;transition:border-color var(--t),background var(--t)}
select:hover,button.btn:hover{border-color:var(--acc)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.copybtn{background:linear-gradient(180deg,#2d63e0,#2453c6);color:#fff;border:0;border-radius:9px;padding:0 16px;height:40px;font-size:13px;font-weight:600;cursor:pointer;transition:filter 160ms ease,transform 90ms ease}
.copybtn:hover{filter:brightness(1.12)}
.copybtn:active{transform:translateY(1px)}
.btn:active,.copybtn:active{transform:translateY(1px)}
.dd{position:relative}
.ddbtn{background:var(--bg3);border:1px solid var(--line2);color:var(--txt);border-radius:9px;padding:0 12px;height:40px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;max-width:300px;min-width:0;transition:border-color var(--t)}
.ddbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ddbtn:hover{border-color:var(--acc)}
.ddbtn .carat{color:var(--dim);font-size:10px;transition:transform var(--t)}
.dd.open .ddbtn .carat{transform:rotate(180deg)}
.ddpanel{position:absolute;top:calc(100% + 6px);right:0;min-width:280px;max-width:min(420px,calc(100vw - 32px));background:var(--bg2);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 44px #000a;padding:6px;display:none;z-index:60;max-height:320px;overflow-y:auto}
.dd.open .ddpanel{display:block}
.dditem{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:8px;cursor:pointer;font-size:13px;transition:background var(--t)}
.dditem:hover{background:var(--bg3)}
.dditem.active{background:#1a2a4a}
.dditem .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dditem .dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dditem .dot.err{background:var(--err)}
.dditem .em{flex:1;font-family:var(--mono);font-size:12.5px;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.dditem .eml{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
.dditem .se{font-family:system-ui;font-size:10px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.dditem .se.se-ok{color:var(--ok)}
.dditem .se.se-warn{color:var(--warn)}
.dditem .se.se-exp{color:var(--err)}
.dditem .ts{font-size:10.5px;color:var(--dim);white-space:nowrap;flex:none}
.ddempty{padding:12px;text-align:center;color:var(--dim);font-size:12px}
.layout{display:flex;height:calc(100vh - 118px);min-height:0}
.listpane{width:340px;min-width:280px;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:10px}
.panehead{display:flex;align-items:center;gap:8px;padding:2px 6px 10px;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.panehead-n{background:var(--bg3);border:1px solid var(--line2);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--dim);font-weight:600}
.msg{background:var(--bg3);border:1px solid transparent;border-radius:10px;padding:12px 14px;cursor:pointer;margin-bottom:8px;transition:border-color .15s,background .15s}
.msg:hover{border-color:var(--line2);background:#1a202a}
.msg:active{transform:scale(.997)}
.msg .subj{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .snip{font-size:12px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .meta{font-size:11px;color:var(--dim);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.detailpane{flex:1;display:none;flex-direction:column;background:var(--bg);min-width:0}
.detailpane.open{display:flex}
.detailbar{background:var(--bg2);padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.detailbar button{background:var(--bg3);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px}
.detailbar button:hover{border-color:var(--acc)}
.detailbar .subj{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detailpane iframe{flex:1;border:0;background:#fff;width:100%}
.empty{padding:48px 20px;color:var(--dim);text-align:center;font-size:13px;line-height:1.7}
.empty b{color:var(--mut)}
.home{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:40px}
.home h2{font-size:18px;margin:0 0 8px;color:var(--mut);font-weight:600}
.home p{font-size:13px;margin:0;max-width:340px;line-height:1.7}
.toast{position:fixed;right:22px;bottom:22px;background:#1c2f57;border:1px solid #30508f;color:#fff;border-radius:12px;padding:13px 18px;font-size:13px;box-shadow:0 10px 30px #0009;opacity:0;transform:translateY(12px);transition:.25s;z-index:99;max-width:360px}
.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;max-width:460px;width:calc(100vw - 32px);max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px #000c}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head b{font-size:15px}
.modal-head button{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:0 4px}
.modal-head button:hover{color:var(--txt)}
.modal-body{padding:4px 0}
.sess-item{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line2);font-size:13px}
.sess-item:last-child{border:none}
.sess-item .em{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sess-item .ex{font-size:11px;color:var(--dim);white-space:nowrap}
.sess-item .ex.warn{color:var(--warn)}.sess-item .ex.exp{color:var(--err)}
.sess-item button{flex:none;background:var(--bg3);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer}
.sess-item button:hover{border-color:var(--acc)}
a{color:var(--acc2)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#3a4356}
@media(max-width:820px){
  .layout{flex-direction:column;height:calc(100dvh - 145px);overflow:hidden}
  .listpane{width:100%;max-height:none;height:auto;flex:1 1 auto;min-height:0;overflow-y:auto}
  .detailpane{min-height:0}
  header,.addrbar{padding:12px 16px}
  .brand .tag{display:none}
  #credchips{display:none}
  header{gap:8px;height:52px;padding:0 12px}
  .hdr-actions{gap:8px}
  .hdr-actions a{padding:0 11px;height:34px;font-size:12px}
  .addr{max-width:100%;font-size:13px}
  .addrbar{flex-wrap:nowrap;gap:6px}
  .hacc{display:none}
  .ddbtn{max-width:26vw;min-width:0;padding:0 8px}
  #address{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* dropdown anchored to the trigger (never moves with content) */
  .ddpanel{position:fixed;left:12px;right:12px;top:auto;min-width:0;max-width:none;width:auto;max-height:min(320px,50vh)}
  /* full-screen email popup on mobile */
  .detailpane{position:fixed;inset:0;z-index:80;min-height:0;height:100dvh}
  .detailbar{padding:12px 14px}
  .detailpane iframe{flex:1}
  /* fullscreen list on mobile — no placeholder eating the screen */
  .home{display:none!important}
  .listpane{max-height:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark"><i class="fa-solid fa-envelope-open-text"></i></div>
    <h1>Mail<span class="dot">Hub</span></h1>
    <span class="tag" title="realtime inbox · choose your gmail">tempmail-style · choose your gmail</span>
    <span class="tag" style="color:var(--acc);font-weight:700">v9</span>
  </div>
  <div class="hdr-actions">
    <span id="credchips"></span>
    <a href="/docs"><i class="fa-solid fa-book"></i> docs</a>
    <button onclick="openSessions()" title="manage sessions"><i class="fa-solid fa-shield-halved"></i> sessions</button>
    <a href="/logout" title="log out"><i class="fa-solid fa-arrow-right-from-bracket"></i> logout</a>
  </div>
</header>
<div class="modal" id="sessmodal" onclick="if(event.target===this)closeSessions()">
  <div class="modal-box">
    <div class="modal-head"><b>Sessions</b><button onclick="closeSessions()">&times;</button></div>
    <div class="modal-body" id="sessbody"></div>
  </div>
</div>
<div class="addrbar">
  <span class="badge" id="state">connecting…</span>
  <span class="addr" id="address" title="click to copy email" onclick="copyAddr()">—</span>
  <div class="dd" id="dd">
    <button class="ddbtn" id="ddbtn" onclick="toggleDD(event)"><span id="ddcur">choose account</span><span class="carat">▼</span></button>
    <div class="ddpanel" id="ddpanel" role="listbox"></div>
  </div>
  <button class="btn" id="refreshbtn" onclick="refresh()"><i class="fa-solid fa-rotate-right"></i> refresh</button>
  <span class="muted" id="hacc" style="flex:1;text-align:right"></span>
</div>
<div class="layout">
  <div class="listpane" id="listpane">
    <div class="panehead"><span class="panehead-t">Inbox</span><span class="panehead-n" id="thcount">0</span></div>
    <div id="list"></div>
  </div>
  <div class="home" id="home"><div><h2>Select a message to read</h2><p>Tap any thread to open it here. Bodies render sandboxed (no scripts, safer views).</p></div></div>
  <div class="detailpane" id="detail">
    <div class="detailbar"><button onclick="closeDetail()"><i class="fa-solid fa-arrow-left"></i> back</button><span class="subj" id="dsubj"></span></div>
    <iframe id="dbody" sandbox="allow-same-origin" title="message body"></iframe>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
let current=null, threads=[], accs=[];
let openGen=0, accGen=0, openingTid=null; // stale-response guards
const $=id=>document.getElementById(id);
async function j(u){const r=await fetch(u);if(!r.ok)throw 0;return r.json();}
async function loadAccounts(opts={}){
  accs=await j('/api/accounts');
  if(!accs.some(a=>a.email===current)) current=null;
  renderDD();
  if(!current&&accs.length) current=accs[0].email;
  if(current) openAcc(current,{silent:true}); else { $('state').className='badge err'; $('state').textContent='no accounts'; $('address').textContent='add via scripts/run-batch.mjs'; $('ddcur').textContent='no accounts'; $('home').style.display='flex'; $('detail').classList.remove('open'); }
}
function sessionInfo(a){
  if(!a.session_expiry) return '';
  const left = a.session_expiry - Date.now();
  const days = Math.floor(left / 864e5);
  const label = left <= 0 ? 'expired' : (days >= 1 ? `${days}d` : `${Math.max(1,Math.round(left/36e5))}h`);
  const cls = left <= 0 ? 'se-exp' : left < 7*864e5 ? 'se-warn' : 'se-ok';
  return `<span class="se ${cls}" title="session expires ${new Date(a.session_expiry).toLocaleString()}"><i class="fa-solid fa-clock"></i> ${label}</span>`;
}
function renderDD(){
  const p=$('ddpanel');
  p.innerHTML=accs.map(a=>`<div class="dditem ${a.email===current?'active':''}" role="option" onclick="openAcc('${esc(a.email)}');closeDD()">
    <span class="dot ${a.last_error?'err':'on'}"></span>
    <span class="em"><span class="eml">${esc(a.email)}</span>${sessionInfo(a)}</span>
    <span class="ts">${a.last_sync?new Date(a.last_sync).toLocaleTimeString():''}</span>
  </div>`).join('')||'<div class="ddempty">no accounts — add via scripts/run-batch.mjs</div>';
  $('ddcur').textContent=current||'choose account';
  $('address').textContent=current||'—';
}
async function openSessions(){
  const b=$('sessbody');
  try {
    const list=await j('/api/sessions');
    b.innerHTML=list.map(s=>{
      const exp=s.expiry?new Date(s.expiry).toLocaleString():'?';
      const left=s.expiry?s.expiry-Date.now():0;
      const lbl=s.expiry?(left<=0?'expired':`${Math.floor(left/864e5)}d ${Math.max(0,Math.round((left%864e5)/36e5))}h`):'?';
      const isCurrent=s.current;
      const loc=s.ip||'?';
      const created=s.created?new Date(s.created).toLocaleString():'?';
      return `<div class="sess-item" style="flex-wrap:wrap;gap:4px">
        <span class="em" style="${isCurrent?'color:var(--acc2);font-weight:600':''}">${isCurrent?'<i class="fa-solid fa-check-circle"></i> ':''}${loc}${isCurrent?' (you)':''}</span>
        <span class="ex ${left<=0?'exp':(left<864e5?'warn':'')}">exp ${exp} (${lbl})</span>
        <span class="ex" style="width:100%;font-size:10px">logged in ${created}</span>
        ${!isCurrent?`<button onclick="revokeSession(${s.id})" style="background:var(--bg3);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer">revoke</button>`:''}
      </div>`;
    }).join('')||'<div class="sess-item">no sessions</div>';
    // add manual login instructions at the bottom
    b.innerHTML+=`<div class="sess-item" style="border-top:1px solid var(--line2);margin-top:8px"><span class="ex">Log in on another device with the same password.</span></div>`;
  } catch { b.innerHTML='<div class="sess-item">could not read sessions</div>'; }
  $('sessmodal').classList.add('open');
}
function closeSessions(){ $('sessmodal').classList.remove('open'); }
function revokeSession(id){
  fetch('/api/session/revoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})})
    .then(r=>r.json()).then(d=>{ if(d.ok) openSessions(); else toast('<i class="fa-solid fa-triangle-exclamation"></i> revoke failed'); })
    .catch(()=>toast('<i class="fa-solid fa-triangle-exclamation"></i> revoke failed'));
}
function toggleDD(e){
  e.stopPropagation();
  const open=$('dd').classList.toggle('open');
  if(open && window.innerWidth<=820){
    // anchor the dropdown just below the trigger so it never jumps with content
    const r=$('ddbtn').getBoundingClientRect();
    const p=$('ddpanel');
    p.style.top=(r.bottom+6)+'px';
  }
}
function closeDD(){ $('dd').classList.remove('open'); }
document.addEventListener('click',(e)=>{ if(!e.target.closest('#dd')) closeDD(); });
async function openAcc(email,opts={}){
  const gen=++accGen;
  openGen++; // invalidate any in-flight thread open
  current=email;
  $('ddcur').textContent=email;
  renderDD();
  try{ await fetch('/api/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}); }catch{}
  const a=accs.find(x=>x.email===email);
  $('state').className='badge '+(a&&a.last_error?'err':(opts.silent?'on':'sync'));
  $('state').innerHTML=a&&a.last_error?'<i class="fa-solid fa-triangle-exclamation"></i> '+esc(a.last_error):(opts.silent?'● live':'syncing…');
  $('address').textContent=email;
  $('hacc').textContent=(a&&a.last_sync)?'last sync '+new Date(a.last_sync).toLocaleTimeString():'never synced';
  const list=$('list');
  if(!opts.silent) list.innerHTML='<div class="empty">loading…</div>';
  closeDetail(); // closes open mail cleanly, home stays hidden until renderList
  try{
    const msgs=await j(`/api/accounts/${encodeURIComponent(email)}/messages?limit=100`);
    if(gen!==accGen || email!==current) return; // stale — account switched mid-load
    threads=msgs; renderList();
    $('state').className='badge on'; $('state').textContent='● live';
  }catch(e){ if(e===0) location.href='/login.html'; else if(!opts.silent && gen===accGen) $('list').innerHTML='<div class="empty">failed to load</div>'; }
}
function cleanSubj(s){ const t=String(s||'').trim(); return t&&!/^\(?(no subject|unknown|\(unknown sender\))\)?$/i.test(t) ? t : ''; }
function cleanSender(s){ const t=String(s||'').trim(); if(!t) return ''; return /^\(unknown sender\)$/i.test(t) ? '' : t; }
function subjFallback(t){ const s=cleanSubj(t.subject); if(s) return s; return cleanSender(t.sender)||cleanSender(t.sender_name)||'(no subject)'; }
function renderList(){
  const tcount=$('thcount'); if(tcount) tcount.textContent=threads.length;
  // show home placeholder ONLY when the list is truly empty and nothing is loading
  $('home').style.display = threads.length===0 ? 'flex' : 'none';
  // sort ascending (oldest first) so the list reads naturally top-to-bottom
  const sorted = [...threads].sort((a,b)=>(a.ts||0)-(b.ts||0));
  $('list').innerHTML=sorted.map(t=>`<div class="msg" role="button" tabindex="0" onclick="openThread('${esc(t.thread_id)}')" onkeydown="if(event.key==='Enter')openThread('${esc(t.thread_id)}')">
    <div class="subj">${esc(subjFallback(t))}</div>
    <div class="snip">${esc(t.snippet||'')}</div>
    <div class="meta"><span>${esc(cleanSender(t.sender)||cleanSender(t.sender_name)||'')}</span><span>${t.ts&&new Date(t.ts).toString()!=='Invalid Date'?new Date(t.ts).toLocaleString():''}</span></div>
  </div>`).join('')||'<div class="empty">no mail in the last 20 days<br><span class="muted">switch account or wait for new mail</span></div>';
}
async function openThread(tid){
  if(openingTid===tid) return; // spam guard: same thread already opening
  const gen=++openGen;
  openingTid=tid;
  $('home').style.display='none';
  const d=$('detail');
  d.classList.add('open');
  const ifr=$('dbody');
  // find the thread in the current list for an instant preview
  const t=threads.find(x=>x.thread_id===tid);
  $('dsubj').textContent=t?.subject||'loading…';
  const fmt=(ms)=>ms?(new Date(ms).toString()==='Invalid Date'?'':new Date(ms).toLocaleString()):'';
  writeBody(ifr, `<div style="padding:18px;font:13px system-ui;color:#666">${esc(t?.snippet||'loading message…')}</div>`);
  let msgs=[];
  try{ const r=await j(`/api/accounts/${encodeURIComponent(current)}/messages/${encodeURIComponent(tid)}`); msgs=Array.isArray(r)?r:[]; }catch(e){ msgs=[]; }
  if(gen!==openGen || current!==$('address').textContent){ openingTid=null; return; } // stale — account switched
  openingTid=null;
  if(!msgs.length){ toast('<i class="fa-solid fa-triangle-exclamation"></i> could not load this email'); closeDetail(); return; }
  $('dsubj').textContent=msgs[0]?.subject||'(no subject)';
  const html=msgs.map(m=>`<div style="border-bottom:1px solid #e4e7ec;padding:14px 18px;font:13px system-ui;background:#f8fafc"><b>${esc(m.sender||'')}</b> ${m.sender_name?`<span style="color:#888">${esc(m.sender_name)}</span>`:''} ${fmt(m.ts)?`· ${fmt(m.ts)}`:''}<br>${m.recipients?`<span style="color:#888">To:</span> ${esc(m.recipients)}`:''}</div><div style="padding:16px 18px">${m.body_html?`<div style="font-size:14px;line-height:1.6">${m.body_html}</div>`:`<div style="font-size:13px;color:#444;line-height:1.6">${esc(m.snippet||'(no body)')}</div>`}</div>`).join('<hr style="border:0;border-top:1px solid #eef1f5">');
  writeBody(ifr, html);
}
// write into the iframe via document.write — far more reliable than srcdoc with
// raw Gmail HTML (which can contain stray </style>/<base> that break srcdoc parsing).
function writeBody(ifr, html){
  try {
    const doc = ifr.contentDocument || ifr.contentWindow.document;
    doc.open();
    doc.write(`<!doctype html><html><head><meta charset="utf-8"><base target="_blank"><style>
      html,body{margin:0;padding:0;background:#fff}body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#23272f;word-break:break-word;font-size:14px;line-height:1.55}
      img{max-width:100%;height:auto}table{max-width:100%}a{color:#1a73e8}</style></head><body>${html}</body></html>`);
    doc.close();
  } catch (e) {
    // fallback: srcdoc
    ifr.srcdoc = `<style>body{font-family:system-ui;margin:0;color:#23272f}</style>${html}`;
  }
}
function closeDetail(){ $('detail').classList.remove('open'); $('home').style.display = threads.length===0 ? 'flex' : 'none'; }
async function refresh(){
  const a=accs.find(x=>x.email===current); if(!a) return;
  const btn=$('refreshbtn'); btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-circle-notch fa-spin"></i> Syncing…';
  $('state').className='badge sync'; $('state').textContent='syncing…';
  try{ await fetch(`/api/accounts/${encodeURIComponent(current)}/messages/refresh`,{method:'POST'}); }catch{}
  await loadAccounts({silent:true});
  btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-rotate-right"></i> refresh';
  $('state').className='badge on'; $('state').textContent='● live';
  toast(`<i class="fa-solid fa-check"></i> synced · ${threads.length} threads`);
}
function copyAddr(){ copyText(current||''); }
function copyText(t){ navigator.clipboard.writeText(t).then(()=>toast('<i class="fa-regular fa-copy"></i> copied')).catch(()=>{}); }
function toast(msg){ const t=$('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),3200); }
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDetail(); closeDD(); } });
const es=new EventSource('/api/sse');
es.addEventListener('update',e=>{ loadAccounts({silent:true}); });
es.addEventListener('new',e=>{const d=JSON.parse(e.data); if(d.email!==current) toast('<i class="fa-solid fa-inbox"></i> new mail in '+d.email); else { loadAccounts({silent:true}); toast('<i class="fa-solid fa-inbox"></i> new mail — inbox updated'); } });
(function(){try{const c=JSON.parse(sessionStorage.getItem('mailhub_creds')||'null');if(c?.apiKey){$('credchips').innerHTML=`<span class="muted">key in <a href="/docs">docs</a> (masked here)</span>`;}}catch(_){}})();
loadAccounts({silent:true}).catch(()=>location.href='/login.html');
</script>
